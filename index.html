<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang Chuyển Hướng...</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Hiệu ứng ánh sáng nền -->
  <div class="bg-circle bg-circle-1"></div>
  <div class="bg-circle bg-circle-2"></div>

  <!-- Thẻ nội dung chính -->
  <div class="card">
    <!-- Biểu tượng chuyển tiếp bảo mật -->
    <div class="icon-wrapper">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
    </div>

    <!-- Tiêu đề & Mô tả -->
    <h1 id="page-title">Đang Chuyển Hướng</h1>
    <p id="page-subtitle" class="subtitle">Nhấn vào nút bên dưới để tiếp tục truy cập an toàn.</p>

    <!-- Nút bấm chuyển tiếp -->
    <a href="#" id="redirect-btn" class="btn-redirect">
      <span id="redirect-btn-text">Truy cập ngay</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </a>

    <!-- Bộ đếm ngược (nếu bật trong config) -->
    <div id="countdown-container" class="countdown-container">
      Tự động chuyển tiếp sau <strong id="countdown-seconds">0</strong> giây...
    </div>
  </div>

  <!-- Nạp file cấu hình và logic -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
