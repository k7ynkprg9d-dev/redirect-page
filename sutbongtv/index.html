<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>SÚT BÓNG TV - Trực Tiếp Bóng Đá</title>
  <link rel="stylesheet" href="../style.css?v=3">
</head>
<body>
  <!-- Hiệu ứng ánh sáng nền -->
  <div class="bg-circle bg-circle-1"></div>
  <div class="bg-circle bg-circle-2"></div>

  <!-- Thẻ nội dung chính -->
  <div class="card">
    <!-- Biểu tượng -->
    <div class="icon-wrapper">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon>
      </svg>
    </div>

    <!-- Tiêu đề & Mô tả -->
    <h1 id="page-title">SÚT BÓNG TV</h1>
    <p id="page-subtitle" class="subtitle">Nhấn vào nút bên dưới để truy cập xem trực tiếp bóng đá.</p>

    <!-- Nút bấm chuyển tiếp -->
    <a href="#" id="redirect-btn" class="btn-redirect">
      <span id="redirect-btn-text">Truy cập ngay</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </a>

    <!-- Bộ đếm ngược (nếu bật trong config) -->
    <div id="countdown-container" class="countdown-container">
      Tự động chuyển tiếp sau <strong id="countdown-seconds">0</strong> giây...
    </div>
  </div>

  <!-- Nạp file cấu hình riêng và script chung -->
  <script src="config.js?v=3"></script>
  <script src="../script.js?v=3"></script>
</body>
</html>
